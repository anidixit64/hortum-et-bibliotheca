[project]
name = "hortum-pipeline"
version = "0.1.0"
description = "Offline pipeline that builds corpus.db from the raw tossup dump"
requires-python = ">=3.12"
dependencies = [
    "hortum-common",
    "fastembed>=0.4",
    # onnxruntime stopped publishing Intel-Mac wheels after 1.19.
    "onnxruntime<1.20; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "httpx>=0.27",
    "pydantic-settings>=2.4",
    "pyyaml>=6.0",
    "rapidfuzz>=3.9",
    "scikit-learn>=1.5",
    "spacy>=3.8",
    "en-core-web-sm",
]

[tool.uv.sources]
hortum-common = { workspace = true }
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }

[project.scripts]
hortum-pipeline = "hortum_pipeline.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hortum_pipeline"]
