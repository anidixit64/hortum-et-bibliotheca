[project]
name = "hortum-pipeline"
version = "0.1.0"
description = "Offline pipeline that builds corpus.db from the raw tossup dump"
requires-python = ">=3.12"
dependencies = [
    "pydantic-settings>=2.4",
]

[project.scripts]
hortum-pipeline = "hortum_pipeline.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hortum_pipeline"]
