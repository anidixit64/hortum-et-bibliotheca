# Tracer questions: followed through every pipeline stage.
#
# Each stage's expected output for these two questions was checked by hand. `verify`
# asserts them against the real corpus after each stage, and the unit tests rebuild a
# tiny corpus from the raw records in tracer_records.ndjson and assert them again.
# When a later phase adds a stage, add its expectations here.

