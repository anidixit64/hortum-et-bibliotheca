# Tracer questions: followed through every pipeline stage.
#
# Each stage's expected output for these two questions was checked by hand. `verify`
# asserts them against the real corpus after each stage, and the unit tests rebuild a
# tiny corpus from the raw records in tracer_records.ndjson and assert them again.
# When a later phase adds a stage, add its expectations here. Cluster expectations only
# hold on the full corpus (a cluster needs other questions to join), so the unit tests
# stop at the clues stage.

tracers:
  - id: 68fd4029a03782f1b6579154
    topic: Invisible Man
    why: >-
      The power mark sits right after an abbreviation ("Dr. (*) Bledsoe"), a quotation
      ends with a period, and the giveaway is buried mid-sentence ("... occurs in, for 10
      points, what ..."), so that whole sentence is the giveaway. A labeled Phase 2 topic.
    expect:
      ingest:
        answer_text: "Invisible Man [reject The Invisible Man which is a different novel]"
      parse-answers:
        main: Invisible Man
        reject: [The Invisible Man]
      group:
        norm_key: invisible man
        category: Literature
        subcategory: American Literature
      link:
        topic: Q1784288
        title: Invisible Man
      clues:
        power_word: 50
        kinds: [clue, clue, clue, giveaway]
        in_power: [true, true, false, false]
        starts:
          - "This novel's protagonist declares himself"
          - "In this novel, the protagonist leads a rich trustee"
          - "The unnamed narrator of this novel is sealed underground"
          - "A \"Battle Royale\" scene occurs in, for 10 points"
        key_terms:
          1: ["Jim Trueblood's", "Dr. Bledsoe"]
      cluster:
        # Checked by eye on the full corpus (October 2026): the expulsion storyline (30
        # questions), Ras the Exhorter/Destroyer (38), the Battle Royal(e) (20).
        cluster_min_questions: {1: 15, 2: 20}
        cluster_mentions:
          1: [Dr. Bledsoe, Jim Trueblood, Mr. Norton]
          2: [Ras the Exhorter, Ras the Destroyer]
      score:
        # Invisible Man's 17 picks (October 2026), most-asked first: Ras the Exhorter (36
        # sets), Dr. Bledsoe (30), Battle Royale (19), Sambo, 1,369 bulbs, Liberty Paints,
        # Rinehart, Lucius Brockway, Sybil, ... The Battle Royale isn't this question's clue
        # any more: here it sits in the giveaway sentence.
        rank_at_most: {1: 2, 2: 1}

  - id: 68b2ff0d8940d9f7c563a1a8
    topic: Drosophila melanogaster
    why: >-
      Opens with a moderator note, puts the power mark between initials
      ("T. H. (*) Morgan"), and has a quoted pronunciation guide and unusual Unicode
      ("BᐧX-C"). A labeled Phase 2 topic.
    expect:
      ingest:
        answer_text: "Drosophila melanogaster [or D. melanogaster or fruit fly; prompt on fly]"
      parse-answers:
        main: Drosophila melanogaster
        accept: [D. melanogaster, fruit fly]
        prompt: [fly]
      group:
        norm_key: drosophila melanogaster
        category: Science
        subcategory: Biology
      link:
        topic: Q130888
        title: Drosophila melanogaster
      clues:
        power_word: 60
        kinds: [note, clue, clue, clue, clue, giveaway]
        in_power: [true, true, true, true, true, false]
        starts:
          - "NOTE TO MODERATOR:"
          - "Mutagenesis in this organism can be done using P elements."
          - "Ed Lewis mapped this organism's"
          - "A scientist who studied this organism names the unit"
          - "Alfred Sturtevant"
          - "For 10 points, name this insect"
        key_terms:
          2: ["Ed Lewis", "BᐧX-C"]
          4: ["room", "Alfred Sturtevant", "Columbia", "T. H. Morgan"]
      cluster:
        # Checked by eye on the full corpus (October 2026): P elements (5 questions), Hox
        # genes (10), Morgan's fly room (19). Clue 3 (the map unit) stays a singleton.
        cluster_min_questions: {1: 3, 2: 5, 4: 10}
        cluster_mentions:
          1: [P element, P-element]
          2: [Hox]
          4: [Thomas Hunt Morgan, T. H. Morgan, Alfred Sturtevant]
      score:
        # Morgan's fly room (19 sets) ranks first, Hox genes (10) fifth, of 13 picks.
        rank_at_most: {4: 1, 2: 5}
