[project]
name = "gateway"
version = "0.1.0"
description = "API gateway: single entry point that routes to backend services"
requires-python = ">=3.12"
dependencies = [
    "hortum-common",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
]

[tool.uv.sources]
hortum-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gateway"]
