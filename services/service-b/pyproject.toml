[project]
name = "service-b"
version = "0.1.0"
description = "Example service B: builds summaries from service A data"
requires-python = ">=3.12"
dependencies = [
    "hortum-common",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
]

[tool.uv.sources]
hortum-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/service_b"]
