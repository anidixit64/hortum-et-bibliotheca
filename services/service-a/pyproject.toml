[project]
name = "service-a"
version = "0.1.0"
description = "Example service A: owns the items resource"
requires-python = ">=3.12"
dependencies = [
    "hortum-common",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[tool.uv.sources]
hortum-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/service_a"]
