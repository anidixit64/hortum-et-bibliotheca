[project]
name = "content"
version = "0.1.0"
description = "Topic content: enrichment and generation cache plus background worker"
requires-python = ">=3.12"
dependencies = [
    "hortum-common",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
]

[project.scripts]
hortum-content = "content.cli:main"

[tool.uv.sources]
hortum-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/content"]
