[project]
name = "hortum-et-bibliotheca"
version = "0.1.0"
description = "Monorepo root for the hortum-et-bibliotheca microservices"
requires-python = ">=3.12"

[tool.uv]
package = false

[tool.uv.workspace]
members = ["libs/*", "services/*"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "ASYNC"]

[tool.ruff.lint.isort]
known-first-party = ["hortum_common", "gateway", "service_a", "service_b"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = ["libs/common/src", "services/gateway/src", "services/service-a/src", "services/service-b/src"]
explicit_package_bases = true

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
asyncio_mode = "auto"
testpaths = ["libs", "services"]
